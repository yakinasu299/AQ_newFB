<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AQ 所見ジェネレーター</title>
  <meta name="description" content="AQの得点データを入力すると、所見文を自動生成するツールです。">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #ffffff;
      --surface: rgba(0,0,0,0.03);
      --surface-hover: rgba(0,0,0,0.06);
      --border: rgba(0,0,0,0.12);
      --accent: #5b4de0;
      --accent-glow: rgba(91,77,224,0.2);
      --accent2: #0d9e7a;
      --text: #1a1a2e;
      --text-muted: #5a5870;
      --radius: 16px;
      --shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans JP', 'Inter', sans-serif;
      min-height: 100vh;
      padding: 0 0 60px;
      background-image:
        radial-gradient(ellipse at 20% 10%, rgba(91,77,224,0.05) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 90%, rgba(13,158,122,0.04) 0%, transparent 50%);
    }
    header {
      text-align: center;
      padding: 52px 20px 36px;
      position: relative;
    }
    header::after {
      content: '';
      display: block;
      width: 120px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      margin: 24px auto 0;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent2);
      background: rgba(91,229,197,0.1);
      border: 1px solid rgba(91,229,197,0.25);
      padding: 4px 14px;
      border-radius: 100px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: clamp(24px, 4vw, 40px);
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--accent);
    }
    .subtitle { margin-top: 10px; color: var(--text-muted); font-size: 14px; }
    .container { max-width: 900px; margin: 0 auto; padding: 0 20px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      margin-bottom: 20px;
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
      transition: border-color 0.2s;
    }
    .card:hover { border-color: rgba(255,255,255,0.14); }
    .card-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 14px;
    }
    textarea {
      width: 100%;
      background: rgba(0,0,0,0.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Noto Sans JP', monospace;
      font-size: 13.5px;
      line-height: 1.8;
      padding: 16px;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    #input-area    { min-height: 200px; }
    #findings-area { min-height: 380px; }
    .btn-row {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
      align-items: center;
    }
    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      padding: 12px 24px;
      transition: all 0.18s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #9d6ff7);
      color: #fff;
      box-shadow: 0 4px 16px rgba(124,106,247,0.35);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(124,106,247,0.5); }
    .btn-primary:active { transform: translateY(0); }
    .btn-secondary {
      background: var(--surface-hover);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.18); }
    .btn-copy {
      background: linear-gradient(135deg, #1f6f5c, var(--accent2));
      color: #fff;
      box-shadow: 0 4px 16px rgba(91,229,197,0.25);
    }
    .btn-copy:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(91,229,197,0.4); }
    .copy-feedback { font-size: 13px; color: var(--accent2); opacity: 0; transition: opacity 0.3s; }
    .copy-feedback.show { opacity: 1; }
    .section-divider { border: none; border-top: 1px solid var(--border); margin: 8px 0 20px; }
    .hint {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 10px;
      line-height: 1.7;
    }
    @media(max-width:600px){
      .card { padding: 20px; }
      .btn-row { flex-direction: column; }
      button { width: 100%; justify-content: center; }
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(12px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .fade-up { animation: fadeUp 0.4s ease both; }
  </style>
</head>
<body>
<header>
  <div class="badge">心理検査ツール</div>
  <h1>AQ 所見ジェネレーター</h1>
  <p class="subtitle">得点データをテキストで貼り付けると、所見文を自動で生成します</p>
</header>

<div class="container">
  <div class="card">
    <div class="card-label">📋 AQ データを貼り付け</div>
    <textarea id="input-area" placeholder="■ AQ
総合　　　　　33点/50点（カットオフ33点）
社会的スキル　 9点/10点（カットオフ 6点）
注意の切り替え　8点/10点（カットオフ 7点）
細部への関心　 7点/10点（カットオフなし）
コミュニケーション　6点/10点（カットオフ 6点）
想像力　　　　 3点/10点（カットオフ 6点）"></textarea>
    <p class="hint">※「総合」「社会的スキル」「注意の切り替え」「細部への関心」「コミュニケーション」「想像力」の各行を含む形式で貼り付けてください。</p>
    <div class="btn-row">
      <button class="btn-primary" onclick="parseAndGenerate()"><span>✦</span> 所見を生成する</button>
      <button class="btn-secondary" onclick="clearAll()">クリア</button>
    </div>
  </div>

  <div class="card" id="findings-section" style="display:none">
    <div class="card-label">📝 所見（編集可能）</div>
    <hr class="section-divider">
    <textarea id="findings-area"></textarea>
    <div class="btn-row">
      <button class="btn-copy" onclick="copyFindings()"><span>📄</span> テキストをコピー</button>
      <span class="copy-feedback" id="copy-feedback">✓ コピーしました</span>
    </div>
  </div>
</div>

<script>
// ── パース ──────────────────────────────────
function parseScores(text) {
  const scores = {
    total: null, social: null, attention: null,
    detail: null, communication: null, imagination: null,
    totalCO: null, socialCO: null, attentionCO: null,
    communicationCO: null, imaginationCO: null
  };

  for (const line of text.split('\n')) {
    // 総合
    let m = line.match(/総合.+?(\d+)点[^\d]/);
    if (m) scores.total = parseInt(m[1]);
    m = line.match(/総合.+?カットオフ\s*(\d+)点/);
    if (m) scores.totalCO = parseInt(m[1]);

    // 社会的スキル
    m = line.match(/社会的スキル.+?(\d+)点[^\d]/);
    if (m) scores.social = parseInt(m[1]);
    m = line.match(/社会的スキル.+?カットオフ\s*(\d+)点/);
    if (m) scores.socialCO = parseInt(m[1]);

    // 注意の切り替え
    m = line.match(/注意の切り替え.+?(\d+)点[^\d]/);
    if (m) scores.attention = parseInt(m[1]);
    m = line.match(/注意の切り替え.+?カットオフ\s*(\d+)点/);
    if (m) scores.attentionCO = parseInt(m[1]);

    // 細部への関心
    m = line.match(/細部への関心.+?(\d+)点[^\d]/);
    if (m) scores.detail = parseInt(m[1]);

    // コミュニケーション
    m = line.match(/コミュニケーション.+?(\d+)点[^\d]/);
    if (m) scores.communication = parseInt(m[1]);
    m = line.match(/コミュニケーション.+?カットオフ\s*(\d+)点/);
    if (m) scores.communicationCO = parseInt(m[1]);

    // 想像力
    m = line.match(/想像力.+?(\d+)点[^\d]/);
    if (m) scores.imagination = parseInt(m[1]);
    m = line.match(/想像力.+?カットオフ\s*(\d+)点/);
    if (m) scores.imaginationCO = parseInt(m[1]);
  }
  return scores;
}

// ── 4段階判定 ──────────────────────────────────
// max: その項目の満点, co: 目安の値
// 大幅に上回る: co+(max-co)*0.5以上, 上回る: co以上, 下回る: co*0.5以上, 大幅に下回る: co*0.5未満
function grade(score, co, max) {
  if (score == null || co == null) return null;
  const bigHigh = co + (max - co) * 0.5;
  const bigLow  = co * 0.5;
  if (score >= bigHigh) return 'vhigh';
  if (score >= co)      return 'high';
  if (score >= bigLow)  return 'low';
  return 'vlow';
}

// ── 所見生成 ────────────────────────────────
function generateFindings(sc) {
  const {
    total, totalCO, social, socialCO, attention, attentionCO,
    detail, communication, communicationCO, imagination, imaginationCO
  } = sc;

  const parts = [];
  const gTotal = grade(total, totalCO, 50);
  const totalHigh = gTotal === 'vhigh' || gTotal === 'high';

  const items = [
    {
      name: '社会的スキル', score: social, grade: grade(social, socialCO, 10),
      difficulty: [
        '初対面の人や複数人での会話で、話し始めるタイミングや話題選びに迷うことがある',
        '相手の反応や場の雰囲気をつかみにくく、どのように振る舞えばよいか悩むことがある',
        '人とのやり取りの最中や終わった後に、緊張や疲れを感じやすいことがある'
      ],
      advice: [
        '会話で使いやすい話題や質問をいくつか準備しておく',
        '大人数より少人数で話す、慣れた相手と関わるなど、自分が話しやすい環境を選ぶ',
        '人と関わった後に一人で過ごす時間を確保し、気持ちを休める'
      ],
      strength: '人との関わりにおいて、相手の様子を見ながら自然にやり取りを進めたり、場面に応じて柔軟に対応したりする力がうかがえます。'
    },
    {
      name: '注意の切り替え', score: attention, grade: grade(attention, attentionCO, 10),
      difficulty: [
        '一つの作業に集中していると、別の作業へ移るまでに時間がかかることがある',
        '急な予定変更や予想外の出来事があると、気持ちや行動を切り替えにくいことがある',
        'いつもと違う手順や進め方に戸惑い、次に何をすればよいか迷うことがある'
      ],
      advice: [
        '予定や作業の順番を、メモやチェックリストなど目で見える形にしておく',
        '作業を切り替える前に少し準備時間を設け、次に行うことを確認する',
        '予定変更が分かった時点で内容や理由を確認し、変更後の流れを整理する'
      ],
      strength: '状況の変化に合わせて注意を切り替えたり、複数のことに柔軟に対応したりする力がうかがえます。'
    },
    {
      name: '細部への関心', score: detail, grade: grade(detail, 5, 10),
      difficulty: [
        '細かな違いや誤りが気になり、作業の確認に時間をかけすぎることがある',
        '一部分に意識が向きやすく、全体の進み具合や優先順位を見失うことがある',
        '周囲の小さな音や変化などが気になり、集中しにくくなることがある'
      ],
      advice: [
        '作業を始める前に「どこまで確認するか」「いつ終えるか」を決めておく',
        '細部の確認と全体の確認を分け、最後に全体を見直す時間を設ける',
        '気になる刺激がある場合は、席や作業環境を調整して集中しやすい状態をつくる'
      ],
      strength: '物事の細かな部分や小さな変化に気づきやすく、丁寧に確認する力がうかがえます。'
    },
    {
      name: 'コミュニケーション', score: communication,
      grade: grade(communication, communicationCO, 10),
      difficulty: [
        '言葉の裏にある意図や、表情・声の調子から相手の気持ちを読み取ることに迷うことがある',
        '冗談や遠回しな表現、曖昧な指示の意味が分かりにくく、確認が必要になることがある',
        '会話のテンポについていくことや、自分の考えをその場で言葉にすることに負担を感じることがある'
      ],
      advice: [
        '曖昧に感じた表現や指示は、「つまり〇〇という理解で合っていますか」と具体的に確認する',
        '口頭だけで分かりにくい内容は、メモやメールなど文字でも確認できるようにする',
        '急いで返答しなくてもよいよう、考える時間が必要なことを相手に伝えておく'
      ],
      strength: '言葉の意味を丁寧に受け止め、内容を具体的に理解しながらやり取りを進める力がうかがえます。'
    },
    {
      name: '想像力', score: imagination,
      grade: grade(imagination, imaginationCO, 10),
      difficulty: [
        '先の展開が分からない状況では、何が起こるか見通しを立てにくく不安を感じることがある',
        '相手の立場や気持ちを推測することが難しく、どのように対応すればよいか迷うことがある',
        '予定外の出来事や初めての場面で、具体的な状況をイメージしにくいことがある'
      ],
      advice: [
        '初めての予定や場所について、事前に流れや必要な情報を確認しておく',
        '相手の気持ちが分からないときは推測だけで判断せず、言葉で確認する',
        '「もしこうなったら」と対応方法をいくつか考え、見通しを持てるようにする'
      ],
      strength: '状況や相手の立場を想像しながら考えたり、先の展開を思い描いたりする力がうかがえます。'
    }
  ];

  const isHigh = g => g === 'high' || g === 'vhigh';
  const isVeryHigh = g => g === 'vhigh';

  // 総合得点の所見
  if (total != null) {
    const cutoffText = totalCO != null ? `（カットオフ値：${totalCO}点）` : '';
    if (totalHigh) {
      parts.push(
        `【所見】AQ総合得点は${total}点/50点${cutoffText}で、カットオフ値以上の結果となりました。\n` +
        '総合得点からはASDに関連する特性がうかがわれる結果ですが、AQのみで診断が確定するものではありません。'
      );
    } else {
      parts.push(
        `【所見】AQ総合得点は${total}点/50点${cutoffText}で、カットオフ値を下回る結果となりました。\n` +
        '総合得点からはASD傾向は強くうかがわれない結果でした。ただし、下位項目を見ると、場面によっては負担や苦手さを感じることがあるかもしれません。以下に各項目の特徴を説明します。'
      );
    }
  }

  // 下位項目の所見
  for (const item of items) {
    if (item.score == null || item.grade == null) continue;

    if (isHigh(item.grade)) {
      const levelText = isVeryHigh(item.grade) ? '特に目安の値を上回る' : '目安の値を上回る';
      parts.push(
        `【${item.name}】\n${item.name}は${levelText}結果でした。\n\n` +
        '〇困りごと\n' +
        item.difficulty.map(s => `・${s}`).join('\n') +
        '\n\n〇対策とアドバイス\n' +
        item.advice.map(s => `・${s}`).join('\n')
      );
    } else {
      parts.push(
        `【${item.name}】\n${item.name}は目安の値を下回る結果でした。\n${item.strength}`
      );
    }
  }

  // 総合まとめ
  const highItems = items.filter(item => item.score != null && isHigh(item.grade));
  if (highItems.length > 0) {
    parts.push(
      '【まとめ】\n' +
      '今回の結果では、下位項目の一部に特徴が見られました。ここに挙げた困りごとは、得点傾向から想定される例であり、すべてが当てはまるとは限りません。実際の生活で感じていることと照らし合わせながら、ご本人に合った工夫を取り入れていくことが大切です。'
    );
  } else {
    parts.push(
      '【まとめ】\n' +
      '今回の結果では、下位項目もおおむね目安の値を下回っており、各項目に関連する特性は強くはうかがわれませんでした。ただし、検査結果だけで日常生活での困りごとの有無が決まるものではありません。気になることがある場合は、実際の状況に合わせて対応を検討していくことが大切です。'
    );
  }

  return parts.join('\n\n');
}

// ── メイン ──────────────────────────────────
function parseAndGenerate() {
  const raw = document.getElementById('input-area').value.trim();
  if (!raw) { alert('データを入力してください。'); return; }
  const scores = parseScores(raw);
  if (scores.total === null && scores.social === null) {
    alert('スコアを読み取れませんでした。形式を確認してください。\n例: 総合　33点/50点（目安の値33点）');
    return;
  }
  const sec = document.getElementById('findings-section');
  sec.style.display = 'block';
  sec.classList.add('fade-up');
  document.getElementById('findings-area').value = generateFindings(scores);
  setTimeout(() => sec.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
}

function clearAll() {
  document.getElementById('input-area').value = '';
  document.getElementById('findings-section').style.display = 'none';
}

function copyFindings() {
  const text = document.getElementById('findings-area').value;
  navigator.clipboard.writeText(text).then(() => {
    const fb = document.getElementById('copy-feedback');
    fb.classList.add('show');
    setTimeout(() => fb.classList.remove('show'), 2000);
  }).catch(() => {
    const ta = document.getElementById('findings-area');
    ta.select();
    document.execCommand('copy');
  });
}
</script>
</body>
</html>
